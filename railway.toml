# Default Railway config shared by the scheduled job services.
# Always-on workers (simulation-engine, token-keeper) should use
# /railway.worker.toml via the service's Custom Config File setting;
# /railway.simulation.toml is kept only as a legacy alias.
[build]
builder = "nixpacks"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
